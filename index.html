<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK's Villa | System Maintenance</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0B0C10;
            color: #F7F7F7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .maintenance-card {
            background: #15181F;
            border: 1px solid rgba(240, 184, 39, 0.3);
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .logo-img {
            max-height: 60px;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: rgba(240, 184, 39, 0.12);
            color: #F0B827;
            border: 1px solid rgba(240, 184, 39, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 1.6rem;
            margin-bottom: 14px;
            color: #F7F7F7;
        }
        p {
            color: #B5B8C0;
            font-size: 0.92rem;
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .footer-note {
            font-size: 0.78rem;
            color: #777;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <img src="gallery/logo.png" alt="RK's Villa" class="logo-img">
        <br>
        <span class="badge">Scheduled Maintenance</span>
        <h1>Website Temporarily Unavailable</h1>
        <p>RK's Villa website is currently undergoing brief system updates and maintenance. We will be back online shortly.</p>
        <div class="footer-note">
            &copy; 2026 RK'S VILLA &bull; System Maintenance Mode
        </div>
    </div>
</body>
</html>
